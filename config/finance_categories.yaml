  - id: interest
    names: {en: interest, hi: ब्याज, hinglish: byaaj}
    words:
      en: [interest]
      hi: [ब्याज]
      hinglish: [byaaj, interest]
    keywords: [int pd, interest paid, int.pd, int credit]
    direction: credit
  - id: refunds
    names: {en: refunds, hi: रिफ़ंड, hinglish: refund}
    words:
      en: [refund, refunds]
      hi: [रिफ़ंड, रिफंड, वापसी]
      hinglish: [refund, wapsi]
    keywords: [refund, reversal, rev-]
    direction: credit
  - id: other_income
    names: {en: other income, hi: अन्य आय, hinglish: other income}
    words:
      en: [other income]
      hi: [अन्य आय]
      hinglish: [other income]
    direction: credit
  - id: uncategorised
    names: {en: uncategorised, hi: बिना श्रेणी, hinglish: bina category}
    words:
      en: [uncategorised, uncategorized, other]
      hi: [बिना श्रेणी, अन्य]
      hinglish: [baaki, other]
    direction: debit

