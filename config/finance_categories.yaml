    merchants: [uber, ola, rapido, irctc, indigo, redbus, makemytrip, fastag, indian oil, bharat petroleum, hpcl]
    keywords: [fuel, petrol, fastag, metro]
    direction: debit
  - id: bills
    names: {en: bills and utilities, hi: बिल, hinglish: bill}
    words:
      en: [bills, bill, utilities, electricity, recharge]
      hi: [बिल, बिजली, रिचार्ज]
