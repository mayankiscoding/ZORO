# Finance categorisation rules (read by app/finance/categories.py, reloaded when this file changes).
#
# Rules only: no transactions, balances or amounts live here.
# - categories: id, spoken names per language, intent words (en / hi / hinglish), and match rules.
#   `merchants` match the normalised merchant key (lower case, words separated by single spaces);
#   `keywords` match anywhere in the lower-cased narration. `direction` limits a category to
#   debits or credits. `channels` map a payment channel (atm, cash, ...) to the category.
# - merchants: canonical display names for merchant keys and VPA handles (alias -> name).
# Owner overrides (finance.recategorize with apply_to_merchant) are stored in the database and
# always win over these rules.

version: 1
default_debit: uncategorised
default_credit: other_income

categories:
  - id: food
    names: {en: food and dining, hi: खाना, hinglish: khana}
    words:
      en: [food, dining, restaurant, restaurants, eating out]
      hi: [खाना, भोजन, खाने]
      hinglish: [khana, khaana, khane]
    merchants: [swiggy, zomato, dominos, mcdonalds, kfc, starbucks, eatsure, box8, haldiram]
    keywords: [restaurant, cafe, dhaba, food]
    direction: debit
  - id: groceries
    names: {en: groceries, hi: राशन, hinglish: ration}
    words:
      en: [groceries, grocery]
      hi: [राशन, किराना, सब्ज़ी]
      hinglish: [ration, kirana, sabzi, grocery]
    merchants: [blinkit, zepto, bigbasket, instamart, swiggy instamart, dmart, jiomart, more retail, reliance fresh]
    keywords: [grocery, kirana, supermarket, mart]
    direction: debit
  - id: shopping
    names: {en: shopping, hi: ख़रीदारी, hinglish: shopping}
    words:
      en: [shopping]
      hi: [ख़रीदारी, खरीदारी]
      hinglish: [shopping, kharidari]
    merchants: [amazon, flipkart, myntra, ajio, nykaa, meesho, croma, decathlon]
    keywords: [amazon, flipkart]
    direction: debit
  - id: transport
    names: {en: transport, hi: यातायात, hinglish: transport}
