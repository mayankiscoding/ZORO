  - id: salary
    names: {en: salary, hi: वेतन, hinglish: salary}
    words:
      en: [salary, income, pay]
      hi: [वेतन, तनख़्वाह, आय]
      hinglish: [salary, tankhwah, kamai]
    keywords: [salary, sal credit, payroll]
