    direction: debit
  - id: subscriptions
    names: {en: subscriptions, hi: सदस्यता, hinglish: subscription}
    words:
      en: [subscriptions, subscription, ott]
      hi: [सदस्यता, सब्सक्रिप्शन]
      hinglish: [subscription, subscriptions]
    merchants: [netflix, spotify, hotstar, jiohotstar, prime video, youtube premium, google one, apple, sonyliv, zee5]
    keywords: [subscription, netflix, spotify]
    direction: debit
  - id: health
    names: {en: health, hi: स्वास्थ्य, hinglish: health}
    words:
      en: [health, medical, medicine, pharmacy]
      hi: [स्वास्थ्य, दवा, दवाई]
      hinglish: [dawai, dawa, health]
    merchants: [apollo pharmacy, pharmeasy, 1mg, netmeds, practo, cult fit]
    keywords: [pharmacy, hospital, clinic, medical, diagnostics]
    direction: debit
  - id: rent
    names: {en: rent, hi: किराया, hinglish: kiraya}
    words:
      en: [rent, housing]
      hi: [किराया]
      hinglish: [kiraya, rent]
    merchants: [nobroker, cred rent]
    keywords: [rent]
    direction: debit
  - id: education
    names: {en: education, hi: पढ़ाई, hinglish: padhai}
    words:
      en: [education, school, fees, course]
      hi: [पढ़ाई, फ़ीस, फीस]
      hinglish: [padhai, fees]
    merchants: [byjus, unacademy, coursera, udemy]
    keywords: [school, college, tuition, fees]
    direction: debit
  - id: cash
    names: {en: cash withdrawals, hi: नकद निकासी, hinglish: cash nikasi}
    words:
      en: [cash, atm]
      hi: [नकद, एटीएम]
      hinglish: [cash, atm, nakad]
    channels: [atm]
    direction: debit
  - id: transfers
    names: {en: transfers, hi: ट्रांसफ़र, hinglish: transfer}
    words:
      en: [transfers, transfer]
      hi: [ट्रांसफ़र, ट्रांसफर]
      hinglish: [transfer]
