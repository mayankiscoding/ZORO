# ZORO on a host with Docker. Not runnable on the development Mac (no Docker there).
# Secrets come from .env (see .env.example); nothing is hardcoded. All ports bind to loopback.
#   docker compose up -d --build
name: zoro

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: zoro
      POSTGRES_DB: zoro
      POSTGRES_PASSWORD: ${ZORO_POSTGRES_PASSWORD:?set ZORO_POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoro -d zoro"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${ZORO_MINIO_ACCESS_KEY:?set ZORO_MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${ZORO_MINIO_SECRET_KEY:?set ZORO_MINIO_SECRET_KEY in .env}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ZORO_ENV: ${ZORO_ENV:-production}
      ZORO_DATABASE_URL: postgresql+psycopg://zoro:${ZORO_POSTGRES_PASSWORD}@postgres:5432/zoro
      ZORO_REDIS_URL: redis://redis:6379/0
      ZORO_OBJECT_STORE: minio
      ZORO_MINIO_ENDPOINT: minio:9000
      ZORO_MINIO_SECURE: "false"
      ZORO_CONFIG_DIR: /srv/config
    volumes:
      - ./config:/srv/config:ro
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  redisdata:
  miniodata:
