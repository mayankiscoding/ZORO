<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Only this origin: no inline script or style, no third-party requests, no remote images.
         The server should send the same policy as a header and add frame-ancestors 'none'. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ZORO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="ZORO" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <meta name="description" content="ZORO, your assistant, running on your own server." />
    <title>ZORO</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/app.css" />
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="app" class="shell" data-chrome="none">
      <main id="main" class="main" tabindex="-1">
        <p id="boot-note" class="boot-note">ZORO is starting. If this stays on screen, update the browser.</p>
        <p id="boot-error" class="boot-note" role="alert" hidden></p>
      </main>
      <nav id="tabbar" class="tabbar" aria-label="Sections"></nav>
    </div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <noscript><p class="boot-note">ZORO needs JavaScript turned on in this browser.</p></noscript>
  </body>
</html>
