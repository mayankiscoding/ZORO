# XcodeGen spec for the iPhone app. Generate: scripts/gen_xcode.sh (or `xcodegen generate --spec ios/project.yml`).
# Everything the app does lives in the Swift packages; these targets are thin wrappers.
name: ZORO
options:
  bundleIdPrefix: app.zoro
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"                   # language mode 5, as in every package (swiftLanguageMode(.v5))
    SWIFT_STRICT_CONCURRENCY: complete     # = enableUpcomingFeature("StrictConcurrency")
    SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""                   # set your team in Xcode (Signing & Capabilities)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  ZoroComposition: { path: Packages/ZoroComposition }
  ZoroApp: { path: Packages/ZoroApp }
  ZoroKit: { path: Packages/ZoroKit }
  ZoroDesign: { path: Packages/ZoroDesign }
  ZoroDevice: { path: Packages/ZoroDevice }
  ZoroVoice: { path: Packages/ZoroVoice }
  ZoroPhotos: { path: Packages/ZoroPhotos }
  ZoroCommerce: { path: Packages/ZoroCommerce }
  ZoroLife: { path: Packages/ZoroLife }
  ZoroSystem: { path: Packages/ZoroSystem }
targets:
  ZORO:
    type: application
    platform: iOS
    sources:
      - path: ZORO
        excludes: ["Info.plist", "ZORO.entitlements"]
      - path: ZOROWidgets/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zoro.ios
        INFOPLIST_FILE: ZORO/Info.plist
        CODE_SIGN_ENTITLEMENTS: ZORO/ZORO.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ZORO_HOMEKIT_ENTITLED: "YES"         # set to NO if you remove the HomeKit capability
    dependencies:
      - package: ZoroComposition
        product: ZoroComposition
      - package: ZoroApp
        product: ZoroAppUI
      - package: ZoroKit
        product: ZoroCore
      - package: ZoroKit
        product: ConversationManager
      - package: ZoroDesign
        product: ZoroDesign
      - target: ZOROWidgets
        embed: true
        codeSign: true
  ZOROWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ZOROWidgets
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zoro.ios.widgets
        INFOPLIST_FILE: ZOROWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    dependencies:
      - package: ZoroApp
        product: ZoroAppUI
      - package: ZoroDevice
        product: NativeActionBroker
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  ZOROTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ZOROTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zoro.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ZORO.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ZORO"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: ZORO
      - package: ZoroComposition
        product: ZoroComposition
  ZOROUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ZOROUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zoro.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ZORO
    dependencies:
      - target: ZORO
schemes:
  ZORO:
    build:
      targets:
        ZORO: all
        ZOROWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [ZOROTests, ZOROUITests]
